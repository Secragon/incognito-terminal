name: Bug report
description: Report a reproducible Incognito Terminal problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real passwords, tokens, client names, or terminal captures containing secrets.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop, terminal emulator, and shell
      placeholder: "Kali amd64, XFCE, QTerminal, Zsh"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction using disposable values
      description: Use fake credentials only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
